<!-- Οθόνη δωματίου για smart TV: ίδια με το tablet, με πλοήγηση από τηλεχειριστήριο (βελάκια, OK, Return). -->
<body class="tablet tv">
<header class="tb-top">
  <button class="tb-back hidden" id="back" aria-label="Back">‹</button>
  <div class="tb-title"><b id="hotel">&nbsp;</b><span id="room"></span></div>
  <div class="tb-clock" id="clock"></div>
  <div class="tb-lang"><button data-lang="el">EL</button><button data-lang="en">EN</button></div>
</header>
<main class="tb-main" id="view"></main>
<footer class="tv-hint" aria-hidden="true"><span>▲ ▼ ◀ ▶</span> <b>OK</b> <span>↩</span></footer>
</body>
</html>
